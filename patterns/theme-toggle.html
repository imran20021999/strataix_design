<!-- Strataix · theme toggle · copy into your app -->
<!-- Two parts: a no-FOUC script that sets the attribute BEFORE paint,
     and the toggle button that flips between light/dark + system. -->

<!-- ============================================================
     PART 1 · Inline in <head> of app/layout.tsx · BEFORE any CSS.
     Must be synchronous — do NOT defer or async this.
     ============================================================ -->
<script>
(function () {
  try {
    var saved = localStorage.getItem("sx-theme"); // "light" | "dark" | null
    var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
    var mode = saved || (prefersLight ? "light" : "dark");
    if (mode === "light") document.documentElement.setAttribute("data-theme", "light");
  } catch (_) {}
})();
</script>

<!-- ============================================================
     PART 3 · Plain-HTML variant · if you don't want React state.
     Place anywhere; targets :root[data-theme].
     ============================================================ -->
<button
  type="button"
  id="sx-theme-toggle"
  aria-label="Toggle theme"
  style="width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;
         border:1px solid var(--color-sx-line-2);background:var(--color-sx-panel);
         color:var(--color-sx-muted);border-radius:8px;cursor:pointer">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5"/></svg>
</button>
<script>
document.getElementById("sx-theme-toggle").onclick = function () {
  var html = document.documentElement;
  var next = html.getAttribute("data-theme") === "light" ? "dark" : "light";
  if (next === "light") html.setAttribute("data-theme", "light");
  else html.removeAttribute("data-theme");
  try { localStorage.setItem("sx-theme", next); } catch (_) {}
};
</script>
